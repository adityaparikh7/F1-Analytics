[project]
name = "f1-pitwall-backend"
version = "0.1.0"
description = "F1 Pitwall Dashboard — Backend API and Data Pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.0,<4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=16.0",
    "apscheduler>=3.10,<4.0",
    "pydantic>=2.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
